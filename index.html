<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Music Pro</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Multi-Gradient Canvas -->
  <div class="mesh-bg" id="dynamicBg"></div>
  <div class="mesh-overlay"></div>

  <div class="app-layout">
    <!-- Desktop Left Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <span>Music <span class="premium-badge">PRO</span></span>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" data-nav="home">🏠 Home</button>
        <button class="nav-btn" data-nav="explore">🧭 Explore</button>
        <button class="nav-btn" data-nav="moodmix">✨ Mood & Mixes</button>
        <button class="nav-btn" data-nav="languages">🌐 Languages</button>
      </nav>
      <div class="sidebar-divider"></div>
      <div class="quick-links">
        <span class="ql-label">QUICK DISCOVERY</span>
        <button class="ql-btn" data-filter="Arijit Singh">🎤 Arijit Singh</button>
        <button class="ql-btn" data-filter="Sonu Nigam">🎤 Sonu Nigam</button>
        <button class="ql-btn" data-filter="Rabindra Sangeet">🎼 Rabindra Sangeet</button>
        <button class="ql-btn" data-filter="Bengali Hits">🇧🇩 Bengali Hits</button>
        <button class="ql-btn" data-filter="Bollywood Classics">🇮🇳 Bollywood Classics</button>
        <button class="ql-btn" data-filter="Punjabi Hits">🔥 Punjabi Hits</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <header class="topbar">
        <div class="search-container">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search songs, artists, albums..." autocomplete="off">
            <button id="searchBtn">🔍</button>
            <div class="search-suggestions" id="searchSuggestions"></div>
          </div>
        </div>
      </header>

      <!-- Category Filter Chips -->
      <div class="filter-chips" id="chipsContainer">
        <button class="chip active" data-q="Arijit Singh">Trending</button>
        <button class="chip" data-q="Rabindra Sangeet">Rabindra Sangeet</button>
        <button class="chip" data-q="Lo-Fi Chill">Lo-Fi & Chill</button>
        <button class="chip" data-q="Workout Beats">Workout</button>
        <button class="chip" data-q="Romantic Songs">Romance</button>
        <button class="chip" data-q="Party Dance">Party</button>
        <button class="chip" data-q="English Pop">English Pop</button>
        <button class="chip" data-q="Kishore Kumar">Classic Oldies</button>
      </div>

      <!-- Feed Container -->
      <section class="feed-section" id="feedSection">
        <div class="section-header">
          <h2 id="sectionTitle">Trending Now</h2>
          <span class="badge-320">Pure 320kbps HQ</span>
        </div>
        <div id="dynamicContainer">
          <div class="card-grid" id="songsGrid">
            <p class="status-msg">Loading music...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Persistent Mini Player -->
    <footer class="player-bar" id="playerBar">
      <div class="mini-progress-bar">
        <div class="mini-progress-fill" id="miniProgressFill"></div>
      </div>

      <div class="player-track-info" id="openFullPlayerTrigger">
        <div class="thumb-wrapper">
          <img id="playerThumb" src="icon.png" alt="Cover" onerror="this.src='icon.png'">
          <div class="sound-wave" id="soundWave">
            <span></span><span></span><span></span>
          </div>
        </div>
        <div class="meta-texts">
          <div class="marquee-wrapper">
            <div class="player-title marquee-content" id="playerTitle">No song playing</div>
          </div>
          <div class="marquee-wrapper">
            <div class="player-artist marquee-content clickable-artist" id="playerArtist">-</div>
          </div>
        </div>
      </div>

      <div class="player-center">
        <div class="player-controls">
          <button id="shuffleBtn" class="ctrl-btn sub-ctrl" title="Shuffle">🔀</button>
          <button id="prevBtn" class="ctrl-btn" title="Previous">⏮</button>
          <button id="playPauseBtn" class="ctrl-btn main-ctrl" title="Play/Pause">▶</button>
          <button id="nextBtn" class="ctrl-btn" title="Next">⏭</button>
          <button id="repeatBtn" class="ctrl-btn sub-ctrl" title="Repeat">🔁</button>
        </div>
        <div class="progress-container">
          <span id="currentTime">0:00</span>
          <input type="range" id="progressBar" value="0" min="0" max="100">
          <span id="durationTime">0:00</span>
        </div>
      </div>

      <div class="player-extra">
        <button id="likeBtn" class="ctrl-btn like-btn" title="Like">♡</button>
        <span class="vol-icon">🔊</span>
        <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="0.85">
        <button id="expandDesktopBtn" class="ctrl-btn sub-ctrl" title="Fullscreen">⛶</button>
      </div>
    </footer>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
      <button class="b-nav-btn active" data-nav="home">
        <span>🏠</span>Home
      </button>
      <button class="b-nav-btn" data-nav="explore">
        <span>🧭</span>Explore
      </button>
      <button class="b-nav-btn" data-nav="moodmix">
        <span>✨</span>Moods
      </button>
      <button class="b-nav-btn" data-nav="languages">
        <span>🌐</span>Languages
      </button>
    </nav>
  </div>

  <!-- Fullscreen Swipeable Overlay Player -->
  <div class="fullscreen-player" id="fullscreenPlayer">
    <div class="fs-bg-glow" id="fsBgGlow"></div>
    <div class="fs-header">
      <button class="fs-btn" id="closeFsPlayer" title="Collapse">🞃</button>
      <div class="fs-header-meta">
        <span class="fs-header-title">NOW PLAYING</span>
        <span class="fs-badge-320">HQ 320 KBPS</span>
      </div>
      <button class="fs-btn" id="fsShareBtn">⋮</button>
    </div>

    <div class="fs-body">
      <div class="fs-artwork-container" id="fsSwipeZone">
        <div class="fs-artwork-glow" id="fsArtGlow"></div>
        <div class="fs-artwork" id="fsArtworkCard">
          <img id="fsThumb" src="icon.png" alt="Artwork" onerror="this.src='icon.png'">
        </div>
      </div>

      <div class="fs-track-details">
        <div class="fs-meta">
          <div class="marquee-wrapper fs-marquee-wrapper">
            <div class="fs-title marquee-content" id="fsTitle">No song playing</div>
          </div>
          <div class="marquee-wrapper fs-marquee-wrapper">
            <div class="fs-artist marquee-content clickable-artist" id="fsArtist">-</div>
          </div>
        </div>
        <button class="fs-like-btn" id="fsLikeBtn">♡</button>
      </div>

      <div class="fs-timeline">
        <input type="range" id="fsProgressBar" value="0" min="0" max="100">
        <div class="fs-times">
          <span id="fsCurrentTime">0:00</span>
          <span id="fsDurationTime">0:00</span>
        </div>
      </div>

      <div class="fs-controls">
        <button id="fsShuffleBtn" class="ctrl-btn fs-sub-btn">🔀</button>
        <button id="fsPrevBtn" class="ctrl-btn fs-nav-btn">⏮</button>
        <button id="fsPlayPauseBtn" class="ctrl-btn fs-main-btn">▶</button>
        <button id="fsNextBtn" class="ctrl-btn fs-nav-btn">⏭</button>
        <button id="fsRepeatBtn" class="ctrl-btn fs-sub-btn">🔁</button>
      </div>
    </div>
  </div>

  <audio id="audioElement" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
